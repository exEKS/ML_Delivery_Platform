[project]
name = "ml-delivery-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
default-groups = ["dev", "credit-default"]

[[tool.mypy.overrides]]
module = [
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    "packages/platform_contracts",
]

[dependency-groups]
credit-default = [
    "pandas>=3.0.6",
    "pandera[pandas]>=0.34.1",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "xlrd>=2.0.2",
]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
